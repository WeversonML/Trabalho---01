<!DOCTYPE html>
<html lang="pt-br">
<head>

<body>
<header><nav>
  <a href="index.html">Home</a>
  <a href="curriculo.html">Currículo</a>
  <a href="servicos.html">Serviços</a>
  <a href="contato.html" class="ativo">Contato</a>
</nav></header>

<main id="topo">
  <section>
    <h1>Contato e orçamento</h1>
    <p>Preencha o formulário e eu envio uma proposta. Veja os <a href="servicos.html">valores</a> antes.</p>
    <form action="https://formspree.io/f/SEU_CODIGO" method="post">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" required>

      <label for="tel">Telefone</label>
      <input type="tel" id="tel" name="telefone" placeholder="(27) 90000-0000" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>

      <label>Tipo de pessoa</label>
      <input type="radio" id="pf" name="pessoa" value="fisica" checked><label for="pf" style="display:inline;font-weight:normal">Pessoa física</label>
      <input type="radio" id="pj" name="pessoa" value="juridica"><label for="pj" style="display:inline;font-weight:normal">Pessoa jurídica</label>

      <label>Melhor horário para contato</label>
      <input type="checkbox" name="horario" value="manha">Manhã
      <input type="checkbox" name="horario" value="tarde">Tarde
      <input type="checkbox" name="horario" value="noite">Noite

      <label for="servico">Tipo de serviço</label>
      <select id="servico" name="servico">
        <option value="">Selecione...</option>
        <option>Página estática (1 a 2 páginas)</option>
        <option>Site estático (3 a 5 páginas)</option>
        <option>Site estático (mais de 5 páginas)</option>
        <option>Página dinâmica</option>
        <option>Página super avançada</option>
      </select>

      <label for="desc">Descrição do que deseja contratar</label>
      <textarea id="desc" name="descricao" rows="5"></textarea>

      <label for="prazo">Prazo desejado</label>
      <input type="date" id="prazo" name="prazo">

      <input type="checkbox" id="aceito" name="aceito" required><label for="aceito" style="display:inline;font-weight:normal">Aceito ser contatado</label><br>

      <button type="submit" class="botao">Enviar</button>
      <button type="reset" class="botao">Limpar</button>
    </form>
  </section>
</main>

</body>
</html>
